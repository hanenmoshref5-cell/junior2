name: testttt
description: "تطبيق قياس السكر بالدم"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # إدارة الحالة والتنقل
  get: ^4.7.2

  # الكاميرا
  camera: ^0.10.0
  wakelock_plus: ^1.2.8

  # الرسوم البيانية
  fl_chart: ^0.65.0

  # الصور
  image_picker: ^1.1.2

  # التخزين المحلي
  shared_preferences: ^2.3.2

  # أدوات
  intl: ^0.20.1

  # أيقونات
  cupertino_icons: ^1.0.8

  supabase_flutter: ^2.12.4



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: nasma
      fonts:
        - asset: assets/fonts/nasma.ttf
    - family: wessam
      fonts:
        - asset: assets/fonts/a-arslan-wessam-b.ttf

  assets:
    - assets/fonts/
